name: Verify wine tier 2 (GE patch set)

# Re-runs GE-Proton's own wine patching section on Valve's bleeding-edge wine (tier 1 tag) and checks
# that the result is exactly the tier 2 tag of the DroidDeck-Proton wine branch. No compilation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - patches/**
      - wine
      - wine-staging
      - banner-proton/**
      - .github/workflows/verify-tier2.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Submodules (wine, wine-staging)
        run: |
          git submodule update --init --filter=tree:0 wine wine-staging
      - name: Re-derive tier 2 and compare
        run: banner-proton/verify-tier2.sh
